<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APAC Talent Employer Policy Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/talent-monitor.css?v=20261125" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo-block">
        <h1>APAC <span>Talent Intel</span> · Hiring Monitor</h1>
        <p id="ui-subtitle"></p>
      </div>
      <div class="header-meta">
        <div class="lang-switch" role="group" id="lang-switch" aria-label="Language">
          <button type="button" data-lang="zh" class="active">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <span class="badge v3">V3</span>
        <span class="badge live" id="ui-live"></span>
        <span class="badge" id="lastUpdated"></span>
        <span class="badge" id="ui-badge-peers"></span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="intro-banner" id="ui-intro"></div>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="label" id="ui-stat-roles-label"></div>
        <div class="value" id="statOpenRoles">—</div>
        <div class="sub" id="ui-stat-roles-sub"></div>
      </div>
      <div class="stat-card">
        <div class="label" id="ui-stat-cn-label"></div>
        <div class="value" id="statCnSignals">—</div>
        <div class="sub" id="ui-stat-cn-sub"></div>
      </div>
      <div class="stat-card">
        <div class="label" id="ui-stat-hiring-label"></div>
        <div class="value" id="statHiringEvents">—</div>
        <div class="sub" id="ui-stat-hiring-sub"></div>
      </div>
      <div class="stat-card">
        <div class="label" id="ui-stat-comp-label"></div>
        <div class="value" id="statCompMoves">—</div>
        <div class="sub" id="ui-stat-comp-sub"></div>
      </div>
      <div class="stat-card">
        <div class="label" id="ui-stat-visa-label"></div>
        <div class="value" id="statVisaFriendly">—</div>
        <div class="sub" id="ui-stat-visa-sub"></div>
      </div>
    </section>

    <div class="legend">
      <span><span class="tag hiring">Hiring</span> <span id="ui-legend-hiring"></span></span>
      <span><span class="tag expansion">Expansion</span> <span id="ui-legend-expansion"></span></span>
      <span><span class="tag visa">Visa</span> <span id="ui-legend-visa"></span></span>
      <span><span class="tag comp">Comp</span> <span id="ui-legend-comp"></span></span>
      <span><span class="tag cn">CN</span> <span id="ui-legend-cn"></span></span>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" />
      </div>
      <select id="countryFilter">
        <option value=""></option>
        <option value="SG">新加坡</option>
        <option value="AU">澳大利亚</option>
        <option value="JP">日本</option>
        <option value="KR">韩国</option>
        <option value="CN">中国大陆</option>
        <option value="TW">台湾</option>
        <option value="HK">香港</option>
        <option value="IN">印度</option>
        <option value="MY">马来西亚</option>
        <option value="ID">印尼</option>
        <option value="VN">越南</option>
        <option value="PH">菲律宾</option>
      </select>
      <select id="categoryFilter">
        <option value=""></option>
        <option value="hiring" id="opt-hiring"></option>
        <option value="expansion" id="opt-expansion"></option>
        <option value="visa" id="opt-visa"></option>
        <option value="comp" id="opt-comp"></option>
        <option value="cn" id="opt-cn"></option>
      </select>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="overview" id="ui-tab-overview"></button>
      <button class="tab-btn" data-tab="china" id="ui-tab-china"></button>
      <button class="tab-btn" data-tab="roles" id="ui-tab-roles"></button>
      <button class="tab-btn" data-tab="compensation" id="ui-tab-compensation"></button>
      <button class="tab-btn" data-tab="matrix" id="ui-tab-matrix"></button>
    </nav>

    <section class="panel active" id="panel-overview">
      <div class="grid-2">
        <div class="card">
          <div class="card-header">
            <h2 id="ui-latest-updates"></h2>
            <span class="badge" id="ui-sorted-time"></span>
          </div>
          <div class="timeline" id="timeline"></div>
        </div>
        <div class="card">
          <div class="card-header"><h2 id="ui-ta-focus"></h2></div>
          <div class="focus-panel" id="ui-ta-focus-body"></div>
          <div class="card-header" style="border-top:1px solid var(--border)"><h2 id="ui-visa-focus-title"></h2></div>
          <div class="focus-panel" id="visaFocus"></div>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-china">
      <div class="card">
        <div class="card-header"><h2 id="ui-china-h2"></h2></div>
        <div id="cnSpotlight" class="cn-spotlight"></div>
        <div class="cn-grid" id="cnGrid"></div>
      </div>
    </section>

    <section class="panel" id="panel-roles">
      <div class="card">
        <div class="card-header">
          <h2 id="ui-roles-h2"></h2>
          <span class="badge" id="ui-roles-badge"></span>
        </div>
        <div class="role-grid" id="roleGrid"></div>
      </div>
    </section>

    <section class="panel" id="panel-compensation">
      <div class="card">
        <div class="card-header">
          <h2 id="ui-comp-title"></h2>
          <span class="badge" id="ui-comp-badge"></span>
        </div>
        <div class="comp-table-wrap">
          <table>
            <thead>
              <tr>
                <th id="thComp0"></th><th id="thComp1"></th><th id="thComp2"></th><th id="thComp3"></th>
                <th id="thComp4"></th><th id="thComp5"></th><th id="thComp6"></th><th id="thComp7"></th><th id="thComp8"></th>
              </tr>
            </thead>
            <tbody id="compTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-matrix">
      <div class="card">
        <div class="card-header"><h2 id="ui-matrix-title"></h2></div>
        <div class="comp-table-wrap">
          <table>
            <thead>
              <tr>
                <th id="thMx0"></th><th id="thMx1"></th><th id="thMx2"></th><th id="thMx3"></th>
                <th id="thMx4"></th><th id="thMx5"></th><th id="thMx6"></th>
              </tr>
            </thead>
            <tbody id="matrixBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="ui-footer-note"></span>
    <span id="ui-footer-sources"></span>
    <div class="hub-footer">
      <a href="https://roqianebay.github.io/apac-labor-hr-practice/er-dashboards.html" id="ui-hub-index"></a>
      <a href="https://roqianebay.github.io/apac-labor-hr-practice/" id="ui-hub-labor"></a>
      <a href="https://roqianebay.github.io/apac-ta-employer-monitor/" id="ui-hub-er"></a>
      <a href="https://roqianebay.github.io/apac-policy-monitor/" id="ui-hub-gov"></a>
    </div>
  </footer>

  <script src="js/talent-data.js?v=20261125"></script>
  <script src="js/monitor-lang.js?v=20261125"></script>
  <script src="js/monitor-i18n-overlay.js?v=20261125"></script>
  <script src="js/talent-app.js?v=20261125"></script>
  <script>
    if (window.__applyMonitorEn) window.__applyMonitorEn();
    if (window.MonitorLang) MonitorLang.init({ onLanguageChange: () => { renderVisaFocus(); } });
  </script>
</body>
</html>
